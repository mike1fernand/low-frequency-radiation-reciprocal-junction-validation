name: Paper 1 validation

on:
  workflow_dispatch:
    inputs:
      compact:
        description: Also run the compact physics suite
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release integrity and reference shells
        if: ${{ !inputs.compact }}
        run: python -B verify.py --git-index
      - name: Install compact-suite dependencies
        if: inputs.compact
        run: python -m pip install -r requirements-reference.txt
      - name: Run integrity and compact physics checks
        if: inputs.compact
        run: python -B verify.py --git-index --compact
      - name: Confirm the checkout is unchanged
        shell: bash
        run: test -z "$(git status --porcelain)"
